name: Generate Pac-Man Contributions

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download Pac-Man generator
        run: |
          git clone --depth 1 https://github.com/gregkozakiewicz/pacman-contribution-graph.git pacman-generator

      # Remove as bolinhas douradas dos dias sem contribuição
      - name: Remove golden pellets
        run: |
          python3 - <<'PY'
          import re

          path = "pacman-generator/src/svg.mjs"

          with open(path, "r", encoding="utf-8") as f:
              code = f.read()

          pattern = r'''} else \{
\s*// Empty days are maze corridors dotted with pellets for Pac to eat\.
\s*pellets\.push\(
\s*`<circle class="pellet".*?</circle>`
\s*\);
\s*}'''

          new_code, count = re.subn(
              pattern,
              "} else {\n        }",
              code,
              count=1,
              flags=re.DOTALL
          )

          if count == 0:
              print("Aviso: pellets já podem ter sido removidos ou código mudou.")
          else:
              print("Pellets dourados removidos.")

          with open(path, "w", encoding="utf-8") as f:
              f.write(new_code)
          PY

      # Adiciona os 4 fantasmas no mesmo caminho do Pac-Man
      - name: Add Pac-Man ghosts
        run: |
          python3 - <<'PY'
          import re

          path = "pacman-generator/src/svg.mjs"

          with open(path, "r", encoding="utf-8") as f:
              code = f.read()

          marker = "const pac = `"

          if marker not in code:
              raise SystemExit(
                  "ERRO: const pac não encontrado no svg.mjs."
              )

          ghosts = r'''const ghosts = `
          <!-- BLINKY - vermelho -->
          <g>
            <path
              fill="#ff2d2d"
              d="M-7,6 V-1
                 A7,7 0 0 1 7,-1
                 V6
                 L4,3
                 L1,6
                 L-2,3
                 L-5,6
                 Z"
            />

            <circle cx="-2.5" cy="-1" r="2" fill="#ffffff"/>
            <circle cx="2.5" cy="-1" r="2" fill="#ffffff"/>

            <circle cx="-1.8" cy="-1" r="0.8" fill="#2563eb"/>
            <circle cx="3.2" cy="-1" r="0.8" fill="#2563eb"/>

            <animateMotion
              dur="${dur}s"
              begin="-${round(dur * 0.20)}s"
              repeatCount="indefinite"
              rotate="0"
              path="${motion}"
              keyPoints="0;1"
              keyTimes="0;1"
              calcMode="linear"
            />
          </g>


          <!-- PINKY - rosa -->
          <g>
            <path
              fill="#ff8fd8"
              d="M-7,6 V-1
                 A7,7 0 0 1 7,-1
                 V6
                 L4,3
                 L1,6
                 L-2,3
                 L-5,6
                 Z"
            />

            <circle cx="-2.5" cy="-1" r="2" fill="#ffffff"/>
            <circle cx="2.5" cy="-1" r="2" fill="#ffffff"/>

            <circle cx="-1.8" cy="-1" r="0.8" fill="#2563eb"/>
            <circle cx="3.2" cy="-1" r="0.8" fill="#2563eb"/>

            <animateMotion
              dur="${dur}s"
              begin="-${round(dur * 0.15)}s"
              repeatCount="indefinite"
              rotate="0"
              path="${motion}"
              keyPoints="0;1"
              keyTimes="0;1"
              calcMode="linear"
            />
          </g>


          <!-- INKY - azul -->
          <g>
            <path
              fill="#22d3ee"
              d="M-7,6 V-1
                 A7,7 0 0 1 7,-1
                 V6
                 L4,3
                 L1,6
                 L-2,3
                 L-5,6
                 Z"
            />

            <circle cx="-2.5" cy="-1" r="2" fill="#ffffff"/>
            <circle cx="2.5" cy="-1" r="2" fill="#ffffff"/>

            <circle cx="-1.8" cy="-1" r="0.8" fill="#2563eb"/>
            <circle cx="3.2" cy="-1" r="0.8" fill="#2563eb"/>

            <animateMotion
              dur="${dur}s"
              begin="-${round(dur * 0.10)}s"
              repeatCount="indefinite"
              rotate="0"
              path="${motion}"
              keyPoints="0;1"
              keyTimes="0;1"
              calcMode="linear"
            />
          </g>


          <!-- CLYDE - laranja -->
          <g>
            <path
              fill="#ff9f1c"
              d="M-7,6 V-1
                 A7,7 0 0 1 7,-1
                 V6
                 L4,3
                 L1,6
                 L-2,3
                 L-5,6
                 Z"
            />

            <circle cx="-2.5" cy="-1" r="2" fill="#ffffff"/>
            <circle cx="2.5" cy="-1" r="2" fill="#ffffff"/>

            <circle cx="-1.8" cy="-1" r="0.8" fill="#2563eb"/>
            <circle cx="3.2" cy="-1" r="0.8" fill="#2563eb"/>

            <animateMotion
              dur="${dur}s"
              begin="-${round(dur * 0.05)}s"
              repeatCount="indefinite"
              rotate="0"
              path="${motion}"
              keyPoints="0;1"
              keyTimes="0;1"
              calcMode="linear"
            />
          </g>
          `;

          const pac = `'''

          code = code.replace(
              marker,
              ghosts,
              1
          )

          # Agora coloca os fantasmas dentro do SVG,
          # imediatamente antes do Pac-Man.
          pattern = r'(\$\{pac\}\s*</svg>`;)'

          replacement = '''${ghosts}
          ${pac}

          </svg>`;'''

          code, count = re.subn(
              pattern,
              replacement,
              code,
              count=1
          )

          if count == 0:
              raise SystemExit(
                  "ERRO: não consegui inserir os fantasmas no SVG final."
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(code)

          print("4 fantasmas adicionados com sucesso.")
          PY

      - name: Generate Pac-Man
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd pacman-generator
          node src/generate.mjs --user Matheus1807 --out dist

      - name: Publish Pac-Man
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: pacman-generator/dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
