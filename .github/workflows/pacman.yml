name: Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: pacman
          player_style: opportunistic

      - name: Debug generated SVG
        run: |
          echo "================================"
          echo "ARQUIVOS GERADOS"
          echo "================================"
          find dist -type f -maxdepth 2 -print

          echo ""
          echo "================================"
          echo "INFORMAÇÕES DA ANIMAÇÃO"
          echo "================================"

          grep -E "<frames>|<frameRate>|<durationMs>" \
            dist/pacman-contribution-graph.svg || true

          echo ""
          echo "================================"
          echo "PAC-MAN"
          echo "================================"

          grep -o 'id="pacman"' \
            dist/pacman-contribution-graph.svg | wc -l

          echo ""
          echo "================================"
          echo "GHOSTS"
          echo "================================"

          grep -oiE 'ghost|blinky|pinky|inky|clyde' \
            dist/pacman-contribution-graph.svg | head -30 || true

          echo ""
          echo "================================"
          echo "TRANSFORMAÇÕES"
          echo "================================"

          grep -o 'values="[^"]*"' \
            dist/pacman-contribution-graph.svg | head -30 || true

      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
