name: Generate Pac-Man Contributions

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download Pac-Man generator
        run: |
          git clone --depth 1 https://github.com/pencilrebel/pacman-contribution-graph.git pacman-generator

      - name: Add ghosts
        run: |
          cp .github/pacman/svg.mjs pacman-generator/src/svg.mjs

      - name: Generate Pac-Man
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd pacman-generator
          node src/generate.mjs --user Matheus1807 --out dist

      - name: Publish Pac-Man
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: pacman-generator/dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
