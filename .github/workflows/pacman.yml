name: Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ==========================================
      # 1. GERA O PAC-MAN NORMAL
      # ==========================================
      - name: Generate contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: pacman
          player_style: opportunistic

      # ==========================================
      # 2. TESTA O MOTOR DO PAC-MAN
      # ==========================================
      - name: Test Pac-Man engine
        run: |
          mkdir -p test

          npx --yes pacman-contribution-graph@5.3.2 \
            --game pacman \
            --username test \
            --platform scenario \
            --gameTheme github \
            --scenario checkerboard \
            --output test/pacman-scenario.svg

          echo "================================"
          echo "TESTE DO PAC-MAN"
          echo "================================"

          echo ""
          echo "INFORMACOES DA ANIMACAO:"
          grep -E "<frames>|<frameRate>|<durationMs>" \
            test/pacman-scenario.svg || true

          echo ""
          echo "PAC-MAN:"
          grep -o 'id="pacman"' \
            test/pacman-scenario.svg | wc -l

          echo ""
          echo "GHOSTS:"
          grep -oiE 'ghost|blinky|pinky|inky|clyde' \
            test/pacman-scenario.svg | head -20 || true

          echo ""
          echo "ARQUIVO:"
          ls -lh test/pacman-scenario.svg

      # ==========================================
      # 3. DEBUG DO SVG REAL
      # ==========================================
      - name: Debug generated SVG
        run: |
          echo "================================"
          echo "ARQUIVOS GERADOS"
          echo "================================"

          find dist -type f -maxdepth 2 -print

          echo ""
          echo "================================"
          echo "INFORMACOES DA ANIMACAO"
          echo "================================"

          grep -E "<frames>|<frameRate>|<durationMs>" \
            dist/pacman-contribution-graph.svg || true

          echo ""
          echo "================================"
          echo "PAC-MAN"
          echo "================================"

          grep -o 'id="pacman"' \
            dist/pacman-contribution-graph.svg | wc -l

          echo ""
          echo "================================"
          echo "GHOSTS"
          echo "================================"

          grep -oiE 'ghost|blinky|pinky|inky|clyde' \
            dist/pacman-contribution-graph.svg | head -30 || true

          echo ""
          echo "================================"
          echo "TRANSFORMACOES"
          echo "================================"

          grep -o 'values="[^"]*"' \
            dist/pacman-contribution-graph.svg | head -30 || true

      # ==========================================
      # 4. ENVIA PARA A BRANCH OUTPUT
      # ==========================================
      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
